<!doctype html>
<!-- Live viewer, served by `npm run dev` / `npm run dev-to-lan`: fetches specs/ from the host
     and refreshes on changes. Opened from disk this page stays empty; open index.html instead. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>specs</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">specs <span id="source">live</span></div>
      <nav id="nav" aria-label="Views">
        <a data-view="ideas" href="#ideas">Ideas</a>
        <a data-view="domains" href="#domains">Domains</a>
        <a data-view="board" href="#board">Board</a>
        <a data-view="backlog" href="#backlog">Backlog</a>
        <a data-view="docs" href="#docs">Docs</a>
      </nav>
      <div class="right">
        <span id="status"></span>
        <button type="button" id="chat-toggle" class="chat-toggle" aria-controls="chat" aria-expanded="false" hidden>
          <span class="dot" aria-hidden="true"></span>Chat<span class="badge" hidden></span>
        </button>
        <button type="button" id="reload" data-action="reload" hidden title="Read specs/ on the host again">
          &#8635; Reload
        </button>
      </div>
    </header>
    <main id="main">
      <p class="muted">
        Loading specs&hellip; This page needs the dev server (<code>npm run dev</code>). Opened from disk, use
        <code>index.html</code>.
      </p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
